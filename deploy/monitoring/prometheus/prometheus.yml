global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: traefik
    static_configs:
      - targets: [traefik:8080]
    metrics_path: /metrics

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  - job_name: vector-service
    static_configs:
      - targets: [yacy-vector-service:8001]
    metrics_path: /metrics
